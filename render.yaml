services:
  - type: web
    name: zibo-gis-backend
    env: dotnet
    buildCommand: dotnet publish -c Release -o out
    startCommand: dotnet out/ZIBOGIS.dll
    runtime: dotnet/8.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zibo-gis-db
          property: connectionString
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:1000
